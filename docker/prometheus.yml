global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:8080"]
    metrics_path: /metrics

  - job_name: reporting
    static_configs:
      - targets: ["reporting:8082"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
